<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zlatni Vuk – Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Playfair Display", serif;
    background: #020202;
    color: #f5f5f5;
    height: 100vh;
    overflow: hidden;
}

/* Rich luxury background */
.bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at top, rgba(80, 80, 80, 0.5) 0, transparent 40%),
        radial-gradient(circle at bottom, rgba(40, 30, 10, 0.4) 0, transparent 45%),
        radial-gradient(circle at center, rgba(0, 0, 0, 0.9) 0, #020202 60%);
    z-index: -4;
}

/* Two flake layers */
.gold-flakes-bg,
.gold-flakes-fg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -3;
}

.flake {
    position: absolute;
    background: rgba(255, 215, 0, 0.85);
    box-shadow: 0 0 14px rgba(255, 215, 0, 0.7);
    opacity: 1;
}

/* Foreground vs background */
.flake.fg {
    animation: moveFg 24s linear infinite, shimmer 3.5s ease-in-out infinite, sparkle 4.5s ease-in-out infinite;
}
.flake.bg {
    animation: moveBg 28s linear infinite, shimmer 4.5s ease-in-out infinite, sparkle 5.5s ease-in-out infinite;
    filter: brightness(0.8);
}

/* 7 irregular shapes */
.flake.shape1 { clip-path: polygon(10% 0%, 90% 10%, 100% 50%, 60% 100%, 20% 90%, 0% 40%); }
.flake.shape2 { clip-path: polygon(0% 20%, 40% 0%, 90% 20%, 100% 60%, 70% 100%, 20% 80%); }
.flake.shape3 { clip-path: polygon(20% 0%, 80% 10%, 100% 40%, 80% 90%, 30% 100%, 0% 60%); }
.flake.shape4 { clip-path: polygon(0% 40%, 30% 0%, 90% 0%, 100% 50%, 70% 100%, 10% 90%); }
.flake.shape5 { clip-path: polygon(10% 10%, 70% 0%, 100% 40%, 90% 90%, 40% 100%, 0% 60%); }
.flake.shape6 { clip-path: polygon(10% 0%, 40% 0%, 90% 40%, 70% 60%, 40% 100%, 15% 90%, 0% 40%); }
.flake.shape7 { clip-path: polygon(0% 30%, 30% 0%, 80% 10%, 100% 40%, 90% 80%, 40% 100%, 10% 80%); }

/* Full 360° movement + slow multi-axis rotation */
@keyframes moveFg {
    0% { transform: translate(0, 0) rotateX(0deg) rotateY(0deg) rotate(0deg); }
    100% { transform: translate(var(--dx), var(--dy)) rotateX(18deg) rotateY(26deg) rotate(360deg); }
}
@keyframes moveBg {
    0% { transform: translate(0, 0) rotateX(0deg) rotateY(0deg) rotate(0deg); }
    100% { transform: translate(calc(var(--dx) * 0.6), calc(var(--dy) * 0.6)) rotateX(12deg) rotateY(18deg) rotate(360deg); }
}

/* Gold shimmer pulse */
@keyframes shimmer {
    0% { filter: brightness(0.85); }
    50% { filter: brightness(1.2); }
    100% { filter: brightness(0.85); }
}

/* Warm gold sparkle */
@keyframes sparkle {
    0% { box-shadow: 0 0 12px rgba(255, 215, 0, 0.5); }
    50% { box-shadow: 0 0 26px rgba(255, 215, 0, 0.95); }
    100% { box-shadow: 0 0 12px rgba(255, 215, 0, 0.5); }
}

/* Center wrapper */
.wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
    position: relative;
    z-index: 10;
}

/* Emblem with softer glow */
.logo-circle {
    width: 160px;
    height: 160px;
    margin: 0 auto 30px;
    border-radius: 50%;
    border: 2px solid rgba(255, 215, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.25);
}

.logo-circle img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.6));
}

/* Text styling */
.brand {
    font-size: 148px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #ffd700;
    margin-bottom: 12px;
}

.subtitle-main {
    font-size: 42px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #c9a44b;
    margin-bottom: 14px;
}

.subtitle-line {
    font-size: 38px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b08b3c;
    margin-bottom: 30px;
}

/* WHITE COMING SOON BANNER */
.coming-banner {
    display: inline-block;
    padding: 14px 32px;
    background: #ffffff;
    color: #000000;
    font-size: 30px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    border-radius: 999px;
    border: 2px solid rgba(255, 215, 0, 0.8);
    box-shadow: 0 0 22px rgba(255, 215, 0, 0.35);
    margin: 0 auto 40px;
}

/* Contact */
.email-text {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #a0a0a0;
    margin-bottom: 10px;
}

.email-link {
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ffd700;
    text-decoration: none;
}

.email-link:hover { color: #ffe58a; }

/* Signup form */
.signup-form {
    margin-top: 25px;
    display: inline-flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.signup-input {
    padding: 10px 14px;
    min-width: 300px;
    border-radius: 999px;
    border: 1px solid rgba(255, 215, 0, 0.4);
    background: rgba(10, 10, 10, 0.9);
    color: #f5f5f5;
    font-size: 13px;
    letter-spacing: 0.08em;
    outline: none;
}

.signup-input::placeholder {
    color: #777;
    text-transform: uppercase;
}

.signup-button {
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #b68b2f, #ffd700);
    color: #050505;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
}

.signup-button:hover { filter: brightness(1.08); }

</style>
</head>

<body>

<div class="bg"></div>
<div class="gold-flakes-bg" id="flakes-bg"></div>
<div class="gold-flakes-fg" id="flakes-fg"></div>

<div class="wrapper">
    <div>

        <div class="logo-circle">
            <img src="Zlatnavuk-removebg-preview.png" alt="Zlatni Vuk Emblem">
        </div>

        <div class="brand">ZLATNI VUK</div>
        <div class="subtitle-main">PREMIUM BRANDY</div>
        <div class="subtitle-line">HANDCRAFTED IN SERBIA • 24KT GOLD LEAF</div>

        <!-- WHITE COMING SOON BANNER -->
        <div class="coming-banner">COMING SOON</div>

        <div class="email-text">CONTACT</div>
        <a class="email-link" href="mailto:info@zlatnivuk.com">INFO@ZLATNIVUK.COM</a>

        <form class="signup-form">
            <input type="email" class="signup-input" placeholder="JOIN THE LAUNCH LIST" />
            <button type="submit" class="signup-button">Notify Me</button>
        </form>

    </div>
</div>

<script>
const bgContainer = document.getElementById("flakes-bg");
const fgContainer = document.getElementById("flakes-fg");
const shapes = ["shape1", "shape2", "shape3", "shape4", "shape5", "shape6", "shape7"];

function createFlake(layer) {
    const flake = document.createElement("div");
    flake.classList.add("flake", layer);
    flake.classList.add(shapes[Math.floor(Math.random() * shapes.length)]);

    const sizeBase = layer === "fg" ? 10 : 4;
    const sizeVar = layer === "fg" ? 24 : 14;
    const size = sizeBase + Math.random() * sizeVar;
    flake.style.width = size + "px";
    flake.style.height = size + "px";

    const x = Math.random() * 100;
    const y = Math.random() * 100;
    flake.style.left = x + "%";
    flake.style.top = y + "%";

    const dx = (Math.random() * 200 - 100) + "vw";
    const dy = (Math.random() * 200 - 100) + "vh";
    flake.style.setProperty("--dx", dx);
    flake.style.setProperty("--dy", dy);

    return flake;
}

for (let i = 0; i < 150; i++) bgContainer.appendChild(createFlake("bg"));
for (let i = 0; i < 71; i++) fgContainer.appendChild(createFlake("fg"));
</script>

</body>
</html>
